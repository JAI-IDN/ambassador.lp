<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 880" width="760" height="880" preserveAspectRatio="xMidYMid slice" role="img" aria-label="東京タワーを背景に、夜景の中でスマートフォンを持つ若者">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1733"/>
      <stop offset="0.45" stop-color="#1c2c5c"/>
      <stop offset="0.74" stop-color="#3a3a72"/>
      <stop offset="0.9" stop-color="#7c5170"/>
      <stop offset="1" stop-color="#c97a55"/>
    </linearGradient>
    <radialGradient id="towerGlow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#ffb877" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb877" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd06b"/>
      <stop offset="0.5" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#f2622a"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7e6"/>
      <stop offset="0.7" stop-color="#ffe9b8"/>
      <stop offset="1" stop-color="#ffe9b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="person" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c1430"/>
      <stop offset="1" stop-color="#243056"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd9a8"/>
      <stop offset="1" stop-color="#ff9a6b"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- sky -->
  <rect width="760" height="880" fill="url(#sky)"/>
  <ellipse cx="120" cy="120" rx="160" ry="160" fill="url(#moon)" opacity="0.5"/>
  <circle cx="120" cy="120" r="46" fill="#fff7e6" filter="url(#glow)" opacity="0.85"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="220" cy="80" r="1.6" opacity="0.9"/><circle cx="320" cy="50" r="1.2" opacity="0.7"/>
    <circle cx="430" cy="90" r="1.8" opacity="0.9"/><circle cx="520" cy="60" r="1.3" opacity="0.6"/>
    <circle cx="610" cy="110" r="1.6" opacity="0.85"/><circle cx="690" cy="70" r="1.2" opacity="0.7"/>
    <circle cx="270" cy="160" r="1.3" opacity="0.6"/><circle cx="560" cy="150" r="1.5" opacity="0.8"/>
    <circle cx="660" cy="200" r="1.2" opacity="0.6"/><circle cx="180" cy="210" r="1.4" opacity="0.7"/>
    <circle cx="380" cy="140" r="1.1" opacity="0.5"/><circle cx="480" cy="200" r="1.3" opacity="0.6"/>
  </g>

  <!-- tower glow -->
  <rect x="300" y="180" width="320" height="520" fill="url(#towerGlow)"/>

  <!-- city skyline -->
  <g fill="#0b1228" opacity="0.92">
    <rect x="0" y="600" width="760" height="280"/>
    <rect x="20" y="540" width="70" height="120"/><rect x="100" y="500" width="54" height="160"/>
    <rect x="165" y="560" width="60" height="100"/><rect x="600" y="520" width="64" height="140"/>
    <rect x="672" y="560" width="48" height="100"/><rect x="540" y="558" width="48" height="102"/>
  </g>
  <!-- lit windows -->
  <g fill="#ffd98a" opacity="0.85">
    <rect x="32" y="556" width="6" height="8"/><rect x="46" y="556" width="6" height="8"/><rect x="60" y="572" width="6" height="8"/>
    <rect x="112" y="516" width="6" height="8"/><rect x="126" y="516" width="6" height="8"/><rect x="112" y="540" width="6" height="8"/>
    <rect x="612" y="536" width="6" height="8"/><rect x="640" y="536" width="6" height="8"/><rect x="612" y="566" width="6" height="8"/>
    <rect x="552" y="574" width="6" height="8"/><rect x="568" y="574" width="6" height="8"/>
  </g>

  <!-- Tokyo Tower -->
  <g>
    <!-- legs -->
    <path d="M455 660 L420 700 M455 660 L490 700" stroke="url(#tower)" stroke-width="5" fill="none"/>
    <!-- lower body -->
    <path d="M433 560 L420 700 L490 700 L477 560 Z" fill="url(#tower)" opacity="0.9"/>
    <path d="M438 560 L433 700 M472 560 L477 700 M455 560 L455 700" stroke="#fff3df" stroke-width="1" opacity="0.4"/>
    <!-- mid -->
    <path d="M442 470 L433 560 L477 560 L468 470 Z" fill="url(#tower)"/>
    <!-- deck -->
    <rect x="436" y="466" width="38" height="10" rx="2" fill="#ff7a3d"/>
    <!-- upper -->
    <path d="M449 360 L442 470 L468 470 L461 360 Z" fill="url(#tower)"/>
    <rect x="446" y="356" width="18" height="8" rx="2" fill="#ff7a3d"/>
    <!-- antenna -->
    <path d="M455 300 L449 360 L461 360 Z" fill="url(#tower)"/>
    <line x1="455" y1="300" x2="455" y2="270" stroke="#ff8a3d" stroke-width="3"/>
    <circle cx="455" cy="268" r="3.5" fill="#ffd06b"/>
    <!-- cross bracing -->
    <g stroke="#fff0d6" stroke-width="1.2" opacity="0.45">
      <path d="M433 700 L477 660 M477 700 L433 660 M442 560 L468 520 M468 560 L442 520 M449 470 L461 430 M461 470 L449 430"/>
    </g>
    <ellipse cx="455" cy="700" rx="120" ry="14" fill="#0b1228" opacity="0.6"/>
  </g>

  <!-- warm bokeh -->
  <g filter="url(#soft)">
    <circle cx="300" cy="640" r="10" fill="#ffcaa0" opacity="0.5"/>
    <circle cx="350" cy="680" r="7" fill="#ffe0b0" opacity="0.45"/>
    <circle cx="250" cy="690" r="6" fill="#ffd0a0" opacity="0.4"/>
    <circle cx="560" cy="670" r="9" fill="#ffd9b0" opacity="0.4"/>
  </g>

  <!-- backlit person holding a phone -->
  <g>
    <!-- soft rim light behind -->
    <path d="M500 880 L500 470 q0 -70 70 -70 q70 0 70 70 L640 880 Z" fill="url(#rim)" opacity="0.25" filter="url(#glow)"/>
    <!-- body -->
    <path d="M512 880 L516 560 q4 -54 54 -54 q50 0 54 54 L628 880 Z" fill="url(#person)"/>
    <!-- head -->
    <circle cx="570" cy="476" r="34" fill="url(#person)"/>
    <!-- hair hint -->
    <path d="M540 466 q30 -40 60 0 q-8 -22 -30 -22 q-22 0 -30 22 Z" fill="#0a1126"/>
    <!-- raised arm holding phone -->
    <path d="M540 560 q-30 -10 -34 -54 q-2 -26 16 -34 l12 10 q-12 8 -8 28 q4 30 26 40 Z" fill="url(#person)"/>
    <!-- phone with glowing screen -->
    <g transform="rotate(-16 512 470)">
      <rect x="495" y="446" width="34" height="58" rx="7" fill="#0a1024"/>
      <rect x="499" y="452" width="26" height="46" rx="4" fill="#bfe3ff"/>
      <rect x="499" y="452" width="26" height="46" rx="4" fill="#7cc4ff" opacity="0.5"/>
      <circle cx="512" cy="475" r="16" fill="#eaf6ff" opacity="0.8" filter="url(#glow)"/>
    </g>
    <!-- rim highlight on shoulder/head -->
    <path d="M604 510 q12 -20 6 -44 M598 470 q-8 -28 -28 -34" stroke="url(#rim)" stroke-width="3" fill="none" opacity="0.7" stroke-linecap="round"/>
    <!-- backpack strap -->
    <path d="M548 520 L556 700" stroke="#0a1126" stroke-width="9" opacity="0.7" stroke-linecap="round"/>
  </g>
</svg>
